      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 600px;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin-top: 50px;
      margin-bottom: 50px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 2rem;
      color: #1a3c6d;
      font-weight: 700;
    }
    #dropZone {
      border: 3px dashed #007bff;
      padding: 40px;
      text-align: center;
      color: #007bff;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }
    #dropZone:hover, #dropZone.dragover {
      background: #e7f0fe;
      border-color: #0056b3;
    }
    #fileLabel {
      font-size: 1.1rem;
      font-weight: 500;
      overflow-wrap: break-word;
      white-space: normal;
    }
    #uploadButton {
      background: #007bff;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 8px;
      transition: background 0.3s ease;
    }
    #uploadButton:hover {
      background: #0056b3;
    }
    .progress {
      height: 25px;
      border-radius: 8px;
      overflow: hidden;
    }
    .progress-bar {
      font-weight: 500;
    }
    .alert {
      border-radius: 8px;
    }
    #resultContainer .input-group {
      border-radius: 8px;
      overflow: hidden;
    }
    #copyButton {
      background: #28a745;
      border: none;
      transition: background 0.3s ease;
    }
    #copyButton:hover {
      background: #218838;
    }
    footer {
      color: #6c757d;
      font-size: 0.9rem;
    }
  </style>
</head>

  <div class="container">
    <div class="header">
      <h1>Videy - Free Video Hosting</h1>

    </div>
    <input type="file" id="fileInput" class="d-none" accept="video/mp4,video/quicktime">

      </div>
    </div>
    <button id="uploadButton" class="btn btn-primary mt-4 w-100">Upload Video</button>

      </div>
    </div>
    <footer class="mt-5 text-center">
      <p>© <span id="year"></span> TRUE DOMAIN PRIVACY, LLC</p>
    </footer>
